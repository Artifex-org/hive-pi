# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# pi (https://pi.dev), driven by the agmsg extension in this repo
# (extensions/agmsg). Unlike the rule-file types, delivery here is not a prompt
# asking the model to poll: the extension holds watch.sh open and injects each
# message into the running session, so a message reaches an IDLE pi agent.
# This manifest is what makes `whoami`, `join`, `delivery` and `spawn` know the
# type exists; the extension is what makes it work.
name=pi
template=template.md
cli=pi
spawnable=yes

# Session display name (#339): spawn passes `-n <team>-<agent>`, so the session
# is born named after its role — visible in `pi -r` and in the /resume picker.
name_arg=-n

# Resume by id. pi accepts `--session <path|partial-uuid>`; the recorded id is a
# full session uuid, so the partial-match path is never exercised. The flag is
# order-independent, which satisfies the "resume head right after the cli"
# convention that a subcommand-shaped resume (codex) requires.
resume_arg=--session

model_arg=--model

# The actas prompt is `/agmsg actas <name>` — the command registered by the
# extension, NOT a skill invocation. "/" also keeps spawn's MSYS_ARG_CONV_EXCL
# guard active on Git Bash, which only fires for the "/" prefix.
cmd_prefix=/

# PI_SESSION_ID is injected into every command pi's bash tool runs;
# PI_CODING_AGENT is exported by the CLI itself and therefore reaches an
# extension's own children. Registry order puts `pi` last, so a nested
# claude-code/codex session under pi still detects as itself.
detect=PI_SESSION_ID PI_CODING_AGENT
detect_proc=pi pi-*

# Session-identity vars a same-type spawn must NOT inherit (#294): a child pi
# that saw the parent's session id would key its watcher, lock and watermark on
# a session it does not own.
spawn_unset_env=PI_SESSION_ID PI_SESSION_FILE

# Delivery state for this project: a one-key JSON file the extension reads.
# Not a rules file — nothing here instructs the model.
hooks_file=.pi/agmsg.json

# The exclusive (actas) watcher writes the readiness sentinel, so
# `spawn --wait-ready` has something real to wait for.
monitor=yes

# No `both`: the extension's watcher already delivers into an idle session, so a
# turn-based poll beside it could only produce duplicates.
delivery_modes=monitor turn off
